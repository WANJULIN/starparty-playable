    let newestPlay = 0;

    for (const video of videos) {
      const button = video.previousElementSibling;
      const status = video.nextElementSibling;
      const playLabel = button.textContent;
      video.addEventListener('play', () => {
        if (video.paused) return;
        newestPlay++;
        for (const other of videos) {
          if (other !== video) other.pause();
        }
      });
      button.addEventListener('click', async () => {
        const request = ++newestPlay;
        button.disabled = true;
        button.textContent = button.dataset.loading;
        status.textContent = '';
        try {
          const response = await fetch(video.dataset.file);
          if (!response.ok) throw new Error(response.status);
          const bytes = new Uint8Array(await response.arrayBuffer());
          const media = await crypto.subtle.decrypt(
            {name: 'AES-GCM', iv: bytes.subarray(0, 12)}, key, bytes.subarray(12)
          );
          video.src = URL.createObjectURL(new Blob([media], {type: 'video/mp4'}));
          video.hidden = false;
          button.hidden = true;
          if (request === newestPlay) video.play().catch(() => {});
        } catch (error) {
          button.disabled = false;
          button.textContent = playLabel;
          status.textContent = button.dataset.failure;
        }
      });
    }
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    submit.disabled = true;
    message.textContent = '';
    try {
      const normalized = password.value.replace(/[０-９]/g, char =>
        String.fromCharCode(char.charCodeAt(0) - 0xfee0)).trim();
      const material = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(normalized), 'PBKDF2', false, ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        {name: 'PBKDF2', salt: fromBase64(payload.salt), iterations: payload.iter, hash: 'SHA-256'},
        material, {name: 'AES-GCM', length: 256}, false, ['decrypt']
      );
      const plain = await crypto.subtle.decrypt(
        {name: 'AES-GCM', iv: fromBase64(payload.iv)}, key, fromBase64(payload.ct)
      );
      showPage(new TextDecoder('utf-8', {fatal: true}).decode(plain), key);
    } catch (error) {
      message.textContent = '密碼不對';
      password.select();
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
